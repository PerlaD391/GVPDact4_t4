spring.application.name=culturavibe-act4
# Puerto asignado a Perla (GVPD) para la Act4 en el VPS del equipo.
# La Act1 sigue en el 8081, la Act2 en el 8083 y la Act3 en el 8084, para no chocar.
server.port=8085

# Base de datos MySQL. Las credenciales se pasan con variables de entorno
# para no subirlas al repositorio (DB_URL, DB_USER, DB_PASSWORD).
# En local, con MySQL corriendo, basta con que exista el usuario root sin
# contraseña; la base se crea sola con createDatabaseIfNotExist=true.
# Act4 usa su propia base (culturavibe_act4) para no mezclar sus tablas
# con las de la Act3.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/culturavibe_act4?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: update crea o actualiza las tablas según las entidades.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT: secreto en Base64URL (32 bytes). En el VPS se pasa con la variable
# JWT_SECRET; el valor de aquí es solo el secreto de desarrollo.
# Para generar uno nuevo: openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
app.jwt.secreto=${JWT_SECRET:ucewI6PbmlBPgFRGktWuohG86c11nzFsNduKgHWImW8}
# El token dura 24 horas (en milisegundos).
app.jwt.expiracion-ms=86400000
