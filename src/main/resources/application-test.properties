# Perfil de pruebas locales sin MySQL: base H2 en memoria.
# Se usa con: ./mvnw spring-boot:run -Dspring-boot.run.profiles=test
# En el VPS NO se usa este perfil; ahí corre con MySQL (application.properties).
spring.datasource.url=jdbc:h2:mem:culturavibe_act4;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.secreto=ucewI6PbmlBPgFRGktWuohG86c11nzFsNduKgHWImW8
app.jwt.expiracion-ms=86400000
